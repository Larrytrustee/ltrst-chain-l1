syntax = "proto3";
package ltrstchain.ltrstdex;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "ltrstchain/ltrstdex/params.proto";
import "ltrstchain/ltrstdex/spot.proto";

option go_package = "ltrstchain/x/ltrstdex/types";

// Msg defines the ltrstdex Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams updates the module parameters. Gov-gated.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // CreateSpotMarket lists a new spot trading pair. Gov-gated in
  // Phase 1 (Params.gov_only_market_creation = true).
  rpc CreateSpotMarket(MsgCreateSpotMarket) returns (MsgCreateSpotMarketResponse);

  // UpdateSpotMarketStatus transitions a market between PRE_OPEN /
  // ACTIVE / POST_ONLY / PAUSED / HALTED. Gov-gated.
  rpc UpdateSpotMarketStatus(MsgUpdateSpotMarketStatus) returns (MsgUpdateSpotMarketStatusResponse);

  // PlaceSpotOrder places a new limit or market order. Immediate
  // matching happens inside this handler.
  rpc PlaceSpotOrder(MsgPlaceSpotOrder) returns (MsgPlaceSpotOrderResponse);

  // CancelSpotOrder cancels a single live order. Allowed to the
  // order owner or gov.
  rpc CancelSpotOrder(MsgCancelSpotOrder) returns (MsgCancelSpotOrderResponse);

  // CancelAllSpotOrders cancels every live order owned by the
  // sender, optionally scoped to a single market.
  rpc CancelAllSpotOrders(MsgCancelAllSpotOrders) returns (MsgCancelAllSpotOrdersResponse);
}

// ---------------------------------------------------------------------
// UpdateParams
// ---------------------------------------------------------------------

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ltrstchain/x/ltrstdex/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message MsgUpdateParamsResponse {}

// ---------------------------------------------------------------------
// CreateSpotMarket
// ---------------------------------------------------------------------

message MsgCreateSpotMarket {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ltrstchain/x/ltrstdex/MsgCreateSpotMarket";

  // authority is either gov (default) or an address matching the
  // module authority in module.proto. Checked against
  // Params.gov_only_market_creation.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  string ticker = 2;
  string base_denom = 3;
  string quote_denom = 4;

  string min_price_tick = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string min_quantity = 6 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  uint32 maker_fee_bps = 7;
  uint32 taker_fee_bps = 8;

  // initial_status is the status the market will be created in.
  // Typically PRE_OPEN or ACTIVE.
  MarketStatus initial_status = 9;
}

message MsgCreateSpotMarketResponse {
  uint64 market_id = 1;
}

// ---------------------------------------------------------------------
// UpdateSpotMarketStatus
// ---------------------------------------------------------------------

message MsgUpdateSpotMarketStatus {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ltrstchain/x/ltrstdex/MsgUpdateSpotMarketStatus";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  uint64 market_id = 2;
  MarketStatus new_status = 3;
}

message MsgUpdateSpotMarketStatusResponse {}

// ---------------------------------------------------------------------
// PlaceSpotOrder
// ---------------------------------------------------------------------

message MsgPlaceSpotOrder {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "ltrstchain/x/ltrstdex/MsgPlaceSpotOrder";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  uint64 market_id = 2;

  Side side = 3;
  OrderType type = 4;
  TimeInForce tif = 5;

  // price is the limit price in quote units per base unit. Required
  // for ORDER_TYPE_LIMIT; MUST be empty/"0" for ORDER_TYPE_MARKET.
  string price = 6 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // quantity is the total base-asset quantity to trade.
  string quantity = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // expires_at_block is the optional auto-cancel height. 0 = never.
  int64 expires_at_block = 8;

  // client_order_id is an optional owner-chosen tag. Up to 64 chars.
  // Not required to be unique. Echoed back in the response and the
  // SpotOrder for UI correlation.
  string client_order_id = 9;
}

message MsgPlaceSpotOrderResponse {
  string order_id = 1;
  // filled_quantity is how much of the order matched immediately.
  string filled_quantity = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // resting_quantity is the remainder (if any) left on the book.
  string resting_quantity = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}

// ---------------------------------------------------------------------
// CancelSpotOrder
// ---------------------------------------------------------------------

message MsgCancelSpotOrder {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "ltrstchain/x/ltrstdex/MsgCancelSpotOrder";

  // authority is the order owner, OR the gov/module authority if
  // cancelling a non-owned order (used for HALTED status cleanup).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  uint64 market_id = 2;
  string order_id = 3;
}

message MsgCancelSpotOrderResponse {}

// ---------------------------------------------------------------------
// CancelAllSpotOrders
// ---------------------------------------------------------------------

message MsgCancelAllSpotOrders {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "ltrstchain/x/ltrstdex/MsgCancelAllSpotOrders";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // market_id optionally scopes the cancel to a single market. 0 =
  // cancel across every market.
  uint64 market_id = 2;
}

message MsgCancelAllSpotOrdersResponse {
  uint32 cancelled_count = 1;
}
