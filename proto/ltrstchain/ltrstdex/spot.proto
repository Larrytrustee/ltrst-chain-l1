syntax = "proto3";
package ltrstchain.ltrstdex;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "ltrstchain/x/ltrstdex/types";

// Side is whether an order buys or sells the base asset of a market.
enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

// OrderType controls whether an order needs a limit price.
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

// TimeInForce controls how remaining quantity behaves after match.
enum TimeInForce {
  // Good till cancelled. Any unfilled remainder rests on the book
  // until owner cancels or expires_at_block is reached.
  TIF_GTC = 0;
  // Immediate or cancel. Unfilled remainder refunded and not posted.
  TIF_IOC = 1;
  // Fill or kill. If entire quantity can't be filled at placement,
  // reject atomically with no state change.
  TIF_FOK = 2;
}

// MarketStatus gates which operations are valid against a market.
enum MarketStatus {
  MARKET_STATUS_UNSPECIFIED = 0;
  // PRE_OPEN: market exists, order placement rejected.
  MARKET_STATUS_PRE_OPEN = 1;
  // ACTIVE: normal trading.
  MARKET_STATUS_ACTIVE = 2;
  // POST_ONLY: only maker orders accepted (no taker / crossing).
  MARKET_STATUS_POST_ONLY = 3;
  // PAUSED: no new orders, existing orders remain on book.
  MARKET_STATUS_PAUSED = 4;
  // HALTED: no new orders; existing orders auto-cancelled next block.
  MARKET_STATUS_HALTED = 5;
}

// SpotMarket is a tradeable base/quote pair.
message SpotMarket {
  option (gogoproto.equal) = true;

  uint64 id = 1;

  // ticker is the human-readable display, e.g. "LTRST/USDC".
  string ticker = 2;

  // base_denom is the denom that an order quantity is denominated in.
  string base_denom = 3;

  // quote_denom is the denom used for price and for collateral locked
  // by BUY orders.
  string quote_denom = 4;

  // min_price_tick is the minimum increment of price. LegacyDec.
  string min_price_tick = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // min_quantity is the minimum order size (in base units). LegacyDec.
  string min_quantity = 6 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // maker_fee_bps is basis points (1/10000) taken from maker.
  // Phase 1 = 0.
  uint32 maker_fee_bps = 7;

  // taker_fee_bps is basis points (1/10000) taken from taker.
  uint32 taker_fee_bps = 8;

  MarketStatus status = 9;

  // created_at_block is the height at which gov created the market.
  int64 created_at_block = 10;
}

// SpotOrder is a live or historical order record.
message SpotOrder {
  option (gogoproto.equal) = false;

  // order_id is a deterministic hex string — hash(owner || market || seq).
  string order_id = 1;

  // owner is the sdk.AccAddress bytes of the order placer.
  bytes owner = 2;

  uint64 market_id = 3;

  Side side = 4;
  OrderType type = 5;
  TimeInForce tif = 6;

  // price is a LegacyDec, quote units per base unit. Empty/"0" is
  // only allowed for ORDER_TYPE_MARKET.
  string price = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // quantity is the total base-asset quantity of the order.
  string quantity = 8 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // filled_quantity is cumulative base-asset filled so far.
  string filled_quantity = 9 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // locked_amount is the amount still escrowed for this order.
  // For BUY orders: denominated in quote_denom.
  // For SELL orders: denominated in base_denom.
  string locked_amount = 10 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  int64 created_height = 11;

  // seq is a monotonic per-market placement sequence number, used as
  // the time-priority tie-breaker inside a price level.
  uint64 seq = 12;

  // expires_at_block is the height after which the order auto-cancels.
  // 0 = never expire (until manually cancelled).
  int64 expires_at_block = 13;
}

// SpotFill records a single match between a taker and a maker.
message SpotFill {
  option (gogoproto.equal) = false;

  uint64 fill_seq = 1;
  uint64 market_id = 2;

  string taker_order_id = 3;
  string maker_order_id = 4;

  bytes taker = 5;
  bytes maker = 6;

  // taker_side is the side the taker was on (BUY or SELL).
  Side taker_side = 7;

  // price is the execution price (the maker's resting price).
  string price = 8 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // quantity is base-units filled in this match.
  string quantity = 9 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // taker_fee is quote-denom fee paid by the taker to fee_collector.
  string taker_fee = 10 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // maker_fee is quote-denom fee paid by the maker. 0 in Phase 1.
  string maker_fee = 11 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  int64 block_height = 12;
}

// OrderbookLevel is an aggregated depth level for query responses.
message OrderbookLevel {
  string price = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string total_quantity = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  uint32 order_count = 3;
}
