# CI workflow — verifies the chain source compiles and passes static analysis.
# Runs on every push and PR. No external actions beyond setup-go and checkout.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build + vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -ldflags="-checklinkname=0" -o build/ltrstchaind ./cmd/ltrstchaind
